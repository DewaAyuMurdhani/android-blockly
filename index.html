<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python - Bright</title>

  <!-- Blockly v9.3.3 -->
  <script src="https://unpkg.com/blockly@9.3.3/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@9.3.3/python_compressed.js"></script>
  <script src="https://unpkg.com/blockly@9.3.3/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly@9.3.3/msg/en.js"></script>
  <link rel="stylesheet" href="style.css">

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bright-mode">

<div class="main-layout">
  <!-- Bagian kiri: Blockly workspace -->
  <div class="workspace-section">
    <div class="workspace-header">
      <i class="fas fa-puzzle-piece"></i>
      <span>Blok Program</span>
      <div class="page-info">
        <span>Halaman</span>
        <span id="pageDisplay">1 / 15</span>
        <button id="prevPage"><i class="fas fa-chevron-left"></i></button>
        <button id="nextPage"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    <div id="blocklyDiv"></div>
  </div>

  <!-- Bagian kanan: Python panel -->
  <div class="python-panel">
    <div class="panel-header">
      <i class="fab fa-python"></i>
      <span>Python Editor</span>
    </div>
    
    <div class="mblock-tabs">
      <div class="mblock-tab active" onclick="switchMblockTab('function')" id="tabFunction">
        <i class="fas fa-cog"></i> Function
      </div>
      <div class="mblock-tab" onclick="switchMblockTab('python')" id="tabPython">
        <i class="fab fa-python"></i> Python
      </div>
    </div>
    
    <!-- Mode Selector -->
    <div class="mode-selector">
      <span class="mode-label"><i class="fas fa-sliders-h"></i> Mode:</span>
      <div class="mode-toggle" id="modeToggle">
        <div class="mode-slider" id="modeSlider"></div>
        <div class="mode-option block-mode" onclick="setMode('block')">
          <i class="fas fa-cubes mode-icon"></i> Block
        </div>
        <div class="mode-option manual-mode" onclick="setMode('manual')">
          <i class="fas fa-pen mode-icon"></i> Manual
        </div>
      </div>
      <button class="sync-btn" id="syncBtn" onclick="syncFromBlocks()" title="Sync dari Block">
        <i class="fas fa-sync-alt"></i> Sync
      </button>
    </div>
    
    <div class="code-output-area" id="codeOutputArea">
      <!-- Area untuk tab Function -->
      <div id="functionArea" style="display: flex; flex-direction: column; height: 100%;">
        <!-- Search bar -->
        <div class="function-search">
          <input type="text" id="functionSearch" placeholder="Cari topik...">
        </div>
        
        <!-- Category filters (LOC filter) -->
        <div class="function-categories">
          <span class="function-category active" data-category="all">Semua Topik</span>
          <span class="function-category" data-category="loc1-4">LOC 1-4</span>
          <span class="function-category" data-category="loc5-8">LOC 5-8</span>
          <span class="function-category" data-category="loc9-12">LOC 9-12</span>
        </div>
        
        <!-- Topic list -->
        <div class="function-list" id="functionList"></div>
      </div>
      
      <!-- Area untuk tab Python (split panel) -->
      <div id="pythonSplitArea" style="display: none; height: 100%;" class="split-panel">
        <!-- Code Panel -->
        <div class="code-panel">
          <div class="panel-label">
            <i class="fas fa-code"></i> Kode Python
            <span id="modeIndicator" class="source-indicator blocks">Mode: Block</span>
            <span class="run-indicator" id="codeLineCount">0 baris</span>
            <button class="clear-btn" onclick="clearOutput()">
              <i class="fas fa-trash"></i> Clear
            </button>
          </div>
          <div id="codeArea" contenteditable="true" spellcheck="false">Memuat workspace...</div>
        </div>
        
        <!-- Output Panel -->
        <div class="output-panel">
          <div class="panel-label">
            <i class="fas fa-terminal"></i> Output
            <span class="stop-indicator" id="executionStatus"></span>
            <span class="run-indicator" id="executionTime"></span>
          </div>
          <div id="outputArea"></div>
        </div>
      </div>
    </div>
    
    <div class="action-buttons">
      <button class="mblock-btn" onclick="executeCode()" id="executeBtn" disabled>
        <i class="fas fa-play"></i> Jalankan
      </button>
      <button class="mblock-btn red" onclick="stopExecution()" id="stopBtn" disabled>
        <i class="fas fa-stop"></i> Stop
      </button>
      <button class="mblock-btn orange" onclick="copyCode()">
        <i class="fas fa-copy"></i> Salin
      </button>
    </div>
    
    <div class="status-footer">
      <span><span class="status-dot loading" id="pyodideStatusDot"></span> <span id="statusText">Pyodide memuat...</span></span>
      <span><i class="fas fa-cubes"></i> <span id="blockCount">0</span> blok</span>
      <span><i class="fas fa-code"></i> <span id="lineCount">0</span> baris</span>
    </div>
  </div>
</div>

<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage"></span></div>

<!-- Menambah Blok -->
<xml id="toolbox" style="display: none">
  <!-- Variabel -->
  <category name="Variabel" colour="#FFB347" custom="VARIABLE"></category>

  <!-- Teks / String -->
  <category name="Teks" colour="#FFB347">
    <block type="text"></block>
    <block type="text_join"></block>
    <block type="text_append"></block>
    <block type="text_length"></block>
    <block type="text_isEmpty"></block>
    <block type="text_indexOf"></block>
    <block type="text_charAt"></block>
    <block type="text_getSubstring"></block>
    <block type="text_changeCase"></block>
    <block type="text_trim"></block>
    <block type="text_print"></block>
    <block type="text_prompt_ext"></block>
  </category>

  <!-- Matematika -->
  <category name="Matematika" colour="#FFE55C">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_single"></block>
    <block type="math_trig"></block>
    <block type="math_constant"></block>
    <block type="math_number_property"></block>
    <block type="math_round"></block>
    <block type="math_on_list"></block>
    <block type="math_modulo"></block>
    <block type="math_constrain"></block>
    <block type="math_random_int"></block>
    <block type="math_random_float"></block>
  </category>
  
  <!-- Kontrol / Logika -->
  <category name="Kontrol" colour="#FF8C69">
    <block type="controls_if"></block>
    <block type="controls_ifelse"></block>
    <block type="controls_repeat_ext"></block>
    <block type="controls_whileUntil"></block>
    <block type="controls_for"></block>
    <block type="controls_flow_statements"></block>
  </category>

  <!-- Logika -->
  <category name="Logika" colour="#5CADFF">
    <block type="logic_compare"></block>
    <block type="logic_operation"></block>
    <block type="logic_negate"></block>
    <block type="logic_boolean"></block>
    <block type="logic_null"></block>
    <block type="logic_ternary"></block>
  </category>

  <!-- List / Senarai -->
  <category name="List" colour="#7B9EFF">
    <block type="lists_create_with"></block>
    <block type="lists_repeat"></block>
    <block type="lists_length"></block>
    <block type="lists_isEmpty"></block>
    <block type="lists_indexOf"></block>
    <block type="lists_getIndex"></block>
    <block type="lists_setIndex"></block>
    <block type="lists_getSublist"></block>
    <block type="lists_split"></block>
    <block type="lists_sort"></block>
  </category>

  <!-- Fungsi / Prosedur -->
  <category name="Fungsi" colour="#7B9EFF" custom="PROCEDURE"></category>

</xml>

  // Fungsi untuk menampilkan daftar topik
  function renderTopicList(searchTerm = '', category = 'all') {
    const functionList = document.getElementById('functionList');
    let filteredTopics = pythonTopics;

    if (category !== 'all') {
      filteredTopics = filteredTopics.filter(t => t.category === category);
    }

    if (searchTerm) {
      const term = searchTerm.toLowerCase();
      filteredTopics = filteredTopics.filter(t => 
        t.name.toLowerCase().includes(term) || 
        t.desc.toLowerCase().includes(term) ||
        (t.tags && t.tags.some(tag => tag.includes(term)))
      );
    }

    if (filteredTopics.length === 0) {
      functionList.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">Tidak ada topik yang ditemukan</div>';
      return;
    }

    functionList.innerHTML = filteredTopics.map(topic => `
      <div class="function-item ${expandedTopic === topic.id ? 'expanded' : ''}" onclick="toggleTopic('${topic.id}')">
        <div class="function-name">
          <i class="fas ${expandedTopic === topic.id ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
          ${topic.id}. ${topic.name}
          <span style="margin-left: auto; font-size: 11px; background: #5a8cff20; padding: 2px 6px; border-radius: 10px;">
            LOC: ${topic.loc}
          </span>
        </div>
        <div class="function-desc">${topic.desc}</div>
        ${expandedTopic === topic.id ? `
          <div style="margin-top: 15px;">
            <div style="display: flex; gap: 15px; margin-bottom: 15px; padding: 10px; background: rgba(90,140,255,0.1); border-radius: 6px;">
              <div><i class="fas fa-code"></i> <strong>LOC:</strong> ${topic.loc}</div>
              <div><i class="fas fa-question-circle"></i> <strong>Questions:</strong> ${topic.questions}</div>
              <div><i class="fas fa-tag"></i> <strong>Terms:</strong> ${topic.terms}</div>
            </div>
            
            <div class="function-syntax">${topic.syntax}</div>
            
            <div class="function-example">
              <i class="fas fa-info-circle"></i> <strong>Penjelasan:</strong><br>
              ${topic.explanation}
            </div>
            
            <div class="function-example">
              <i class="fas fa-code"></i> <strong>Contoh Kode:</strong><br>
              <pre style="margin: 10px 0; white-space: pre-wrap;">${topic.example}</pre>
            </div>
            
            <div class="function-meta">
              ${topic.tags ? topic.tags.map(tag => `<span class="function-tag">${tag}</span>`).join('') : ''}
            </div>
            
            <button class="insert-btn" onclick="event.stopPropagation(); loadTopicCode(${topic.id})">
              <i class="fas fa-plus"></i> Load Code
            </button>

  window.toggleTopic = function(topicId) {
    const id = parseInt(topicId);
    if (expandedTopic === id) {
      expandedTopic = null;
    } else {
      expandedTopic = id;
    }
    const searchInput = document.getElementById('functionSearch');
    const activeCategory = document.querySelector('.function-category.active');
    const category = activeCategory ? activeCategory.dataset.category : 'all';
    renderTopicList(searchInput.value, category);
  };

  // Load topic code
  window.loadTopicCode = function(topicId) {
    const topic = pythonTopics.find(t => t.id === topicId);
    if (topic) {
      showToast(`Memuat topik: ${topic.name}`);
      
      switchMblockTab('python');
      
      // Set mode ke manual dan masukkan kode
      setMode('manual');
      codeArea.textContent = topic.example;
      
      updateCodeLineCount();
    }
  };

  // Set mode
  window.setMode = function(mode) {
    currentMode = mode;
    
    // Update slider
    if (mode === 'manual') {
      modeSlider.classList.add('manual');
      modeIndicator.innerHTML = '<i class="fas fa-pen"></i> Mode: Manual';
      modeIndicator.className = 'source-indicator manual';
      codeArea.classList.add('manual-mode');
      codeArea.classList.remove('block-mode');
      
      // Enable sync button
      syncBtn.disabled = false;
    } else {
      modeSlider.classList.remove('manual');
      modeIndicator.innerHTML = '<i class="fas fa-cubes"></i> Mode: Block';
      modeIndicator.className = 'source-indicator blocks';
      codeArea.classList.add('block-mode');
      codeArea.classList.remove('manual-mode');
      
      // Disable sync button
      syncBtn.disabled = true;
      
      // Sync dari blocks
      syncFromBlocks();
    }
    
    showToast(`Mode ${mode === 'manual' ? 'Manual' : 'Block'} aktif`);
  };

  // Sync dari blocks
  window.syncFromBlocks = function() {
    const code = Blockly.Python.workspaceToCode(workspace);
    codeArea.textContent = code || '# (kosong)';
    updateCodeLineCount();
    showToast('Disync dari block');
  };

  // Update line count
  function updateCodeLineCount() {
    const lines = codeArea.textContent.split('\n').filter(l => l.trim() !== '').length;
    codeLineCount.textContent = `${lines} baris`;
  }

  // Clear output
  window.clearOutput = function() {
    outputArea.textContent = '';
    executionTime.textContent = '';
    executionStatus.textContent = '';
    showToast('Output dibersihkan');
  };

  // Switch tab
  window.switchMblockTab = function(tab) {
    currentMblockTab = tab;
    document.getElementById('tabFunction').classList.toggle('active', tab === 'function');
    document.getElementById('tabPython').classList.toggle('active', tab === 'python');
    
    if (tab === 'function') {
      functionArea.style.display = 'flex';
      pythonSplitArea.style.display = 'none';
      
      const searchInput = document.getElementById('functionSearch');
      const activeCategory = document.querySelector('.function-category.active');
      renderTopicList(searchInput.value, activeCategory.dataset.category);
    } else {
      functionArea.style.display = 'none';
      pythonSplitArea.style.display = 'flex';
      
      // Update berdasarkan mode
      if (currentMode === 'block') {
        syncFromBlocks();
      }
    }
  };

  function showToast(msg, isError = false, isStop = false) {
    toastMsg.textContent = msg;
    if (isStop) {
      toast.style.background = '#ff5555';
      toast.classList.add('stop');
    } else if (isError) {
      toast.style.background = '#ff5555';
    } else {
      toast.style.background = '#00cc88';
    }
    toast.style.display = 'flex';
    setTimeout(() => {
      toast.style.display = 'none';
      toast.classList.remove('stop');
    }, 2500);
  }

  function updateStats() {
    if (!workspace) return;
    const blocks = workspace.getAllBlocks();
    const blockCount = blocks.length;
    document.getElementById('blockCount').textContent = blockCount;
    
    const code = Blockly.Python.workspaceToCode(workspace);
    const lines = code.split('\n').filter(l => l.trim() !== '').length;
    document.getElementById('lineCount').textContent = lines;
    
    // Update jika mode block
    if (currentMode === 'block' && currentMblockTab === 'python') {
      codeArea.textContent = code || '# (kosong)';
      updateCodeLineCount();
    }
  }

      textBlock.moveBy(80, 160);
      
      printBlock.getInput('TEXT').connection.connect(textBlock.outputConnection);
    }

    if (currentMblockTab === 'python' && currentMode === 'block') {
      const code = Blockly.Python.workspaceToCode(workspace);
      codeArea.textContent = code || '# (kosong)';
      updateCodeLineCount();
    }
    updateStats();
  }

  function updatePageDisplay() {
    pageDisplay.textContent = `${currentPage} / ${totalPages}`;
  }

  function goToPrevPage() {
    if (currentPage > 1) {
      currentPage--;
      updatePageDisplay();
      loadPage(currentPage);
    } else {
      showToast('Sudah di halaman pertama', true);
    }
  }

  function goToNextPage() {
    if (currentPage < totalPages) {
      currentPage++;
      updatePageDisplay();
      loadPage(currentPage);
    } else {
      showToast('Sudah di halaman terakhir', true);
    }
  }

  // Inisialisasi Pyodide
  async function initPyodide() {
    try {
      statusDot.className = 'status-dot loading';
      statusText.textContent = 'Memuat Pyodide...';
      pyodide = await loadPyodide();
      pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
      `);
      statusDot.className = 'status-dot ready';
      statusText.textContent = 'Python siap';
      pyodideReady = true;
      executeBtn.disabled = false;
      showToast('Python ready');
    } catch (e) {
      statusDot.className = 'status-dot ready';
      statusDot.style.background = '#ff5555';
      statusText.textContent = 'Gagal muat';
      showToast('Pyodide error', true);
    }
  }

  function getPythonOutput() {
    if (!pyodideReady) return '';
    try {
      return pyodide.runPython(`
result = sys.stdout.getvalue() + sys.stderr.getvalue()
sys.stdout.truncate(0); sys.stdout.seek(0)
sys.stderr.truncate(0); sys.stderr.seek(0)
result if result else "Program selesai (tanpa output)"
      `);
    } catch (e) {
      return 'Output error';
    }
  }

  // Fungsi untuk menghentikan eksekusi
  window.stopExecution = function() {
    if (isRunning) {
      stopExecutionFlag = true;
      statusDot.className = 'status-dot ready';
      executionStatus.textContent = 'Dihentikan';
      executionStatus.style.color = '#ff5555';
      showToast('Eksekusi dihentikan', false, true);
    }
  };

  window.executeCode = async function() {
    if (!pyodideReady) {
      showToast('Python belum siap', true);
      return;
    }
    
    if (isRunning) {
      showToast('Program sedang berjalan', true);
      return;
    }
    
    const startTime = performance.now();
    const code = codeArea.textContent;
    
    if (!code.trim()) {
      outputArea.textContent = 'Tidak ada kode.';
      executionTime.textContent = '';
      return;
    }

    switchMblockTab('python');
    
    outputArea.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Menjalankan...';
    executeBtn.disabled = true;
    stopBtn.disabled = false;
    isRunning = true;
    stopExecutionFlag = false;
    statusDot.className = 'status-dot running';
    executionStatus.textContent = '⏳ Running...';
    executionStatus.style.color = '#5a8cff';

    try {
      pyodide.runPython(`
sys.stdout.truncate(0); sys.stdout.seek(0)
sys.stderr.truncate(0); sys.stderr.seek(0)
      `);
      
      // Jalankan kode dengan mekanisme stop
      const runPromise = pyodide.runPythonAsync(code);
      
      // Race condition antara runPromise dan stop button
      const result = await Promise.race([
        runPromise,
        new Promise((_, reject) => {
          const checkStop = setInterval(() => {
            if (stopExecutionFlag) {
              clearInterval(checkStop);
              reject(new Error('Eksekusi dihentikan oleh pengguna'));
            }
          }, 100);
        })
      ]);
      
      if (!stopExecutionFlag) {
        const out = getPythonOutput();
        outputArea.textContent = out;
        outputArea.classList.remove('output-error');
        
        const endTime = performance.now();
        const execTime = (endTime - startTime).toFixed(2);
        executionTime.textContent = `${execTime} ms`;
        executionStatus.textContent = 'Selesai';
        executionStatus.style.color = '#00aa66';
        
        showToast('Eksekusi selesai');
      }
    } catch (err) {
      if (err.message === 'Eksekusi dihentikan oleh pengguna') {
        outputArea.textContent = 'Eksekusi dihentikan oleh pengguna';
        executionTime.textContent = '';
      } else {
        outputArea.textContent = 'Error:\n' + err.message;
        outputArea.classList.add('output-error');
        executionTime.textContent = 'error';
        showToast('Runtime error', true);
      }
    } finally {
      executeBtn.disabled = false;
      stopBtn.disabled = true;
      isRunning = false;
      stopExecutionFlag = false;
      statusDot.className = 'status-dot ready';
      if (!executionStatus.textContent.includes('Selesai') && !executionStatus.textContent.includes('Dihentikan')) {
        executionStatus.textContent = '';
      }
    }
  };

  window.copyCode = function() {
    const code = codeArea.textContent;
    navigator.clipboard.writeText(code).then(() => showToast('Kode disalin')).catch(() => showToast('Gagal menyalin', true));
  };

  // Inisialisasi Blockly
  window.onload = function() {
    if (!Blockly) {
      codeArea.textContent = 'Blockly error';
      return;
    }

    // Pengaturan Warna Blocks - Bright theme only
    brightTheme = Blockly.Theme.defineTheme('brightTheme', {
      'base': Blockly.Themes.Classic,
      'blockStyles': {
        'text_blocks': { 'colourPrimary': '#FFB347' },
        'logic_blocks': { 'colourPrimary': '#5CADFF' },
        'math_blocks': { 'colourPrimary': '#FFE55C' },
        'variable_blocks': { 'colourPrimary': '#FFB347' },
        'loop_blocks': { 'colourPrimary': '#FF8C69' },
        'procedure_blocks': { 'colourPrimary': '#7B9EFF' },
        'list_blocks': { 'colourPrimary': '#AA80FF' },
      },
      'componentStyles': {
        'workspaceBackgroundColour': '#f8f9ff',
        'toolboxBackgroundColour': '#f0f3fa',
        'toolboxForegroundColour': '#2c3e50',
        'flyoutBackgroundColour': '#ffffff',
        'scrollbarColour': '#5a8cff',
        'scrollbarOpacity': 0.5
      }
    });

    // Inject Blockly dengan tema bright
    workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      theme: brightTheme,
      trashcan: true,
      scrollbars: true,
      zoom: { controls: true, wheel: true }
    });

    function updateCodeView() {
      if (currentMblockTab === 'python' && currentMode === 'block') {
        const code = Blockly.Python.workspaceToCode(workspace);
        codeArea.textContent = code || '# (kosong)';
        updateCodeLineCount();
      }
      updateStats();
    }
    workspace.addChangeListener(updateCodeView);

    // Listener untuk manual code editing
    codeArea.addEventListener('input', function() {
      if (currentMblockTab === 'python' && currentMode === 'block') {
        // Jika di mode block tapi user mengedit, switch ke manual
        setMode('manual');
      }
      updateCodeLineCount();
    });

    // Muat halaman awal
    loadPage(currentPage);

    // Event listener navigasi
    prevBtn.addEventListener('click', goToPrevPage);
    nextBtn.addEventListener('click', goToNextPage);

    // Setup function tab
    const searchInput = document.getElementById('functionSearch');
    searchInput.addEventListener('input', (e) => {
      const activeCategory = document.querySelector('.function-category.active');
      renderTopicList(e.target.value, activeCategory.dataset.category);
    });

    // Setup category clicks
    document.querySelectorAll('.function-category').forEach(cat => {
      cat.addEventListener('click', (e) => {
        document.querySelectorAll('.function-category').forEach(c => c.classList.remove('active'));
        cat.classList.add('active');
        const searchInput = document.getElementById('functionSearch');
        renderTopicList(searchInput.value, cat.dataset.category);
      });
    });

    // Render initial topic list
    renderTopicList('', 'all');

    // Set initial mode
    setMode('block');

    initPyodide();
  };
</script>

</body>
</html>
